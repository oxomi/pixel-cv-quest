# 게임 규칙과 접속 정보 (환경변수로 주입)
apiVersion: v1
kind: ConfigMap
metadata:
  name: pixel-cv-config
  labels:
    app: pixel-cv
    app.kubernetes.io/part-of: pixel-cv
data:
  REDIS_HOST: "pixel-cv-redis"
  REDIS_PORT: "6379"
  PORT: "8080"
  STATIC_DIR: "/opt/app-root/static"
  PYTHONUNBUFFERED: "1"
  POINTS_PER_VISIT: "10"
  GUESTBOOK_COST: "30"
  RATING_COST: "20"
  MEDIA_BASE: "https://cdn.jsdelivr.net/gh/oxomi/pixel-cv-quest@main/students/202355562/media/"
  VIDEO_URL: "https://cdn.jsdelivr.net/gh/oxomi/pixel-cv-quest@main/students/202355562/media/capstone-video.mp4"
---
# API 서버 코드 (자동 생성: build_configmap.py)
apiVersion: v1
kind: ConfigMap
metadata:
  name: pixel-cv-code
  labels:
    app: pixel-cv
    app.kubernetes.io/part-of: pixel-cv
data:
  server.py: |
    """Pixel CV Quest - 포인트 / 방명록 / 별점 API 서버.

    외부 패키지 없이 Python 표준 라이브러리만 사용한다.
    (이미지를 따로 빌드하지 않고 ConfigMap으로 이 파일을 주입하기 위해서)
    Redis는 RESP 프로토콜을 직접 구현한 작은 클라이언트로 접속한다.
    REDIS_HOST가 비어 있으면 메모리 저장소로 동작한다 (로컬 테스트용).
    """
    import json
    import os
    import re
    import socket
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs, urlparse

    PORT = int(os.environ.get("PORT", "8080"))
    STATIC_DIR = os.environ.get("STATIC_DIR", os.path.join(os.path.dirname(__file__), "static"))
    REDIS_HOST = os.environ.get("REDIS_HOST", "")
    REDIS_PORT = int(os.environ.get("REDIS_PORT", "6379"))
    REDIS_PASSWORD = os.environ.get("REDIS_PASSWORD", "")
    POINTS_PER_VISIT = int(os.environ.get("POINTS_PER_VISIT", "10"))
    GUESTBOOK_COST = int(os.environ.get("GUESTBOOK_COST", "30"))
    RATING_COST = int(os.environ.get("RATING_COST", "20"))
    SPOT_IDS = set(os.environ.get("SPOT_IDS", ",".join([
        "guide", "senior", "teammate", "mc", "scientist", "cat",
        "home_summary", "ws_summary", "ext_summary", "clubs",
        "home_profile", "home_skills", "home_github", "lab_intro", "lab_isaac", "lab_ros", "lab_vla",
        "cap_trophy", "cap_poster", "cap_data", "cap_policy", "cap_video",
        "ws_ongi", "ws_pc", "ws_praise", "ws_pnu", "ws_pnuin", "ws_db", "dcc_intro", "dcc_seg", "dcc_chimney",
    ])).split(","))
    MEDIA_BASE = os.environ.get("MEDIA_BASE", "/media/")
    VIDEO_URL = os.environ.get("VIDEO_URL", MEDIA_BASE + "capstone-video.mp4")
    # 로컬 개발용: MEDIA_BASE가 /media/ 이면 이 폴더의 파일을 직접 서빙한다
    MEDIA_DIR = os.environ.get("MEDIA_DIR", os.path.join(os.path.dirname(__file__), "..", "media"))
    MEDIA_TYPES = {".webp": "image/webp", ".png": "image/png", ".jpg": "image/jpeg", ".mp4": "video/mp4"}
    GUESTBOOK_MAX = 200

    PLAYER_RE = re.compile(r"^[A-Za-z0-9-]{8,64}$")
    CONTENT_TYPES = {".html": "text/html; charset=utf-8", ".js": "text/javascript; charset=utf-8",
                     ".css": "text/css; charset=utf-8", ".svg": "image/svg+xml"}


    class ApiError(Exception):
        def __init__(self, status, message):
            super().__init__(message)
            self.status = status
            self.message = message


    # ---------------------------------------------------------------- Redis client
    class Redis:
        """RESP2 프로토콜만 구현한 최소한의 Redis 클라이언트 (연결 1개 + 락)."""

        def __init__(self, host, port, password):
            self.host, self.port, self.password = host, port, password
            self.sock = None
            self.buf = b""
            self.lock = threading.Lock()

        def _connect(self):
            self.sock = socket.create_connection((self.host, self.port), timeout=3)
            self.buf = b""
            if self.password:
                self._send("AUTH", self.password)
                self._read()

        def _send(self, *args):
            out = [b"*%d\r\n" % len(args)]
            for a in args:
                a = a if isinstance(a, bytes) else str(a).encode()
                out.append(b"$%d\r\n%s\r\n" % (len(a), a))
            self.sock.sendall(b"".join(out))

        def _line(self):
            while b"\r\n" not in self.buf:
                chunk = self.sock.recv(65536)
                if not chunk:
                    raise ConnectionError("redis closed connection")
                self.buf += chunk
            line, self.buf = self.buf.split(b"\r\n", 1)
            return line

        def _exact(self, n):
            while len(self.buf) < n + 2:
                chunk = self.sock.recv(65536)
                if not chunk:
                    raise ConnectionError("redis closed connection")
                self.buf += chunk
            data, self.buf = self.buf[:n], self.buf[n + 2:]
            return data

        def _read(self):
            line = self._line()
            kind, rest = line[:1], line[1:]
            if kind == b"+":
                return rest.decode()
            if kind == b"-":
                raise RuntimeError("redis error: " + rest.decode())
            if kind == b":":
                return int(rest)
            if kind == b"$":
                n = int(rest)
                return None if n < 0 else self._exact(n).decode()
            if kind == b"*":
                n = int(rest)
                return None if n < 0 else [self._read() for _ in range(n)]
            raise RuntimeError("unknown redis reply: %r" % line)

        def call(self, *args):
            with self.lock:
                for attempt in range(2):
                    try:
                        if self.sock is None:
                            self._connect()
                        self._send(*args)
                        return self._read()
                    except (OSError, ConnectionError):
                        self.sock = None
                        if attempt:
                            raise


    # 포인트 차감을 원자적으로 처리하는 Lua 스크립트
    SPEND_LUA = """
    local p = tonumber(redis.call('GET', KEYS[1]) or '0')
    local cost = tonumber(ARGV[1])
    if p < cost then return -1 end
    return redis.call('DECRBY', KEYS[1], cost)
    """
    RATE_LUA = """
    if redis.call('HEXISTS', KEYS[2], ARGV[2]) == 1 then return -2 end
    local p = tonumber(redis.call('GET', KEYS[1]) or '0')
    local cost = tonumber(ARGV[1])
    if p < cost then return -1 end
    redis.call('HSET', KEYS[2], ARGV[2], ARGV[3])
    return redis.call('DECRBY', KEYS[1], cost)
    """


    class RedisStore:
        def __init__(self, client):
            self.r = client

        def ping(self):
            return self.r.call("PING") == "PONG"

        def points(self, player):
            return int(self.r.call("GET", "player:%s:points" % player) or 0)

        def visited(self, player):
            return sorted(self.r.call("SMEMBERS", "player:%s:visited" % player) or [])

        def award_visit(self, player, spot):
            added = self.r.call("SADD", "player:%s:visited" % player, spot)
            if added:
                self.r.call("INCRBY", "player:%s:points" % player, POINTS_PER_VISIT)
            return bool(added)

        def spend(self, player, cost):
            return self.r.call("EVAL", SPEND_LUA, 1, "player:%s:points" % player, cost)

        def add_entry(self, entry):
            self.r.call("LPUSH", "guestbook", json.dumps(entry, ensure_ascii=False))
            self.r.call("LTRIM", "guestbook", 0, GUESTBOOK_MAX - 1)

        def entries(self):
            return [json.loads(x) for x in self.r.call("LRANGE", "guestbook", 0, 49) or []]

        def my_rating(self, player):
            v = self.r.call("HGET", "ratings", player)
            return int(v) if v else None

        def rate(self, player, stars):
            return self.r.call("EVAL", RATE_LUA, 2, "player:%s:points" % player, "ratings",
                               RATING_COST, player, stars)

        def rating_stats(self):
            vals = [int(v) for v in self.r.call("HVALS", "ratings") or []]
            return vals


    class MemoryStore:
        """REDIS_HOST가 없을 때 쓰는 메모리 저장소 (재시작하면 초기화됨)."""

        def __init__(self):
            self.lock = threading.Lock()
            self.pts, self.seen, self.book, self.ratings = {}, {}, [], {}

        def ping(self):
            return True

        def points(self, player):
            return self.pts.get(player, 0)

        def visited(self, player):
            return sorted(self.seen.get(player, set()))

        def award_visit(self, player, spot):
            with self.lock:
                s = self.seen.setdefault(player, set())
                if spot in s:
                    return False
                s.add(spot)
                self.pts[player] = self.pts.get(player, 0) + POINTS_PER_VISIT
                return True

        def spend(self, player, cost):
            with self.lock:
                p = self.pts.get(player, 0)
                if p < cost:
                    return -1
                self.pts[player] = p - cost
                return p - cost

        def add_entry(self, entry):
            with self.lock:
                self.book.insert(0, entry)
                del self.book[GUESTBOOK_MAX:]

        def entries(self):
            return self.book[:50]

        def my_rating(self, player):
            return self.ratings.get(player)

        def rate(self, player, stars):
            with self.lock:
                if player in self.ratings:
                    return -2
                p = self.pts.get(player, 0)
                if p < RATING_COST:
                    return -1
                self.ratings[player] = stars
                self.pts[player] = p - RATING_COST
                return p - RATING_COST

        def rating_stats(self):
            return list(self.ratings.values())


    store = RedisStore(Redis(REDIS_HOST, REDIS_PORT, REDIS_PASSWORD)) if REDIS_HOST else MemoryStore()


    # ---------------------------------------------------------------- API
    def check_player(player):
        if not isinstance(player, str) or not PLAYER_RE.match(player):
            raise ApiError(400, "잘못된 플레이어 ID입니다.")
        return player


    def rating_summary():
        vals = store.rating_stats()
        return {"avg": round(sum(vals) / len(vals), 2) if vals else 0, "count": len(vals)}


    def state(player):
        return {
            "points": store.points(player),
            "visited": store.visited(player),
            "myRating": store.my_rating(player),
            "rating": rating_summary(),
            "costs": {"guestbook": GUESTBOOK_COST, "rating": RATING_COST, "visit": POINTS_PER_VISIT},
            "spotCount": len(SPOT_IDS),
            "media": {"base": MEDIA_BASE, "video": VIDEO_URL},
            "storage": "redis" if REDIS_HOST else "memory",
        }


    def api_visit(body):
        player = check_player(body.get("player"))
        spot = body.get("spot")
        if spot not in SPOT_IDS:
            raise ApiError(400, "모르는 장소입니다.")
        awarded = store.award_visit(player, spot)
        return dict(state(player), awarded=POINTS_PER_VISIT if awarded else 0)


    def api_guestbook(body):
        player = check_player(body.get("player"))
        name = str(body.get("name", "")).strip()[:20]
        message = str(body.get("message", "")).strip()[:200]
        if not name or not message:
            raise ApiError(400, "이름과 메시지를 모두 적어 주세요.")
        if store.spend(player, GUESTBOOK_COST) < 0:
            raise ApiError(402, "G가 부족해요. 집 안 전시물을 읽고 G를 모아 보세요!")
        store.add_entry({"name": name, "message": message, "ts": int(time.time())})
        return dict(state(player), entries=store.entries())


    def api_rating(body):
        player = check_player(body.get("player"))
        try:
            stars = int(body.get("stars"))
        except (TypeError, ValueError):
            stars = 0
        if not 1 <= stars <= 5:
            raise ApiError(400, "별점은 1~5 사이로 골라 주세요.")
        result = store.rate(player, stars)
        if result == -2:
            raise ApiError(409, "이미 별점을 남겼어요. 감사합니다!")
        if result < 0:
            raise ApiError(402, "G가 부족해요. 집 안 전시물을 읽고 G를 모아 보세요!")
        return state(player)


    class Handler(BaseHTTPRequestHandler):
        server_version = "PixelCV/1.0"

        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args), flush=True)

        def _json(self, status, payload):
            data = json.dumps(payload, ensure_ascii=False).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.send_header("Content-Length", str(len(data)))
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            self.wfile.write(data)

        def _guard(self, fn):
            try:
                self._json(200, fn())
            except ApiError as e:
                self._json(e.status, {"error": e.message})
            except Exception as e:  # Redis 장애 등
                print("ERROR", repr(e), flush=True)
                self._json(503, {"error": "서버(DB) 연결에 문제가 있어요. 잠시 후 다시 시도해 주세요."})

        def do_GET(self):
            url = urlparse(self.path)
            q = parse_qs(url.query)
            if url.path == "/alive":
                return self._json(200, {"status": "ok"})
            if url.path == "/health":
                try:
                    store.ping()
                    return self._json(200, {"status": "ok", "storage": "redis" if REDIS_HOST else "memory"})
                except Exception as e:
                    return self._json(503, {"status": "redis unavailable", "error": repr(e)})
            if url.path == "/api/state":
                return self._guard(lambda: state(check_player(q.get("player", [""])[0])))
            if url.path == "/api/guestbook":
                return self._guard(lambda: {"entries": store.entries()})
            return self._static(url.path)

        def do_POST(self):
            routes = {"/api/visit": api_visit, "/api/guestbook": api_guestbook, "/api/rating": api_rating}
            fn = routes.get(urlparse(self.path).path)
            if not fn:
                return self._json(404, {"error": "not found"})
            try:
                length = min(int(self.headers.get("Content-Length", 0)), 8192)
                body = json.loads(self.rfile.read(length) or b"{}")
                if not isinstance(body, dict):
                    raise ValueError
            except ValueError:
                return self._json(400, {"error": "잘못된 요청입니다."})
            self._guard(lambda: fn(body))

        def _media(self, name):
            """로컬 개발용 미디어 서빙 (클러스터에서는 MEDIA_BASE가 외부 CDN을 가리킨다)."""
            ext = os.path.splitext(name)[1]
            if "/" in name or name.startswith(".") or ext not in MEDIA_TYPES:
                return self._json(404, {"error": "not found"})
            try:
                with open(os.path.join(MEDIA_DIR, name), "rb") as f:
                    data = f.read()
            except OSError:
                return self._json(404, {"error": "not found"})
            self.send_response(200)
            self.send_header("Content-Type", MEDIA_TYPES[ext])
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def _static(self, path):
            if path.startswith("/media/"):
                return self._media(path[len("/media/"):])
            name = "index.html" if path in ("", "/") else path.lstrip("/")
            # ConfigMap 마운트에는 ..data 같은 심볼릭 링크가 있으므로 허용 목록으로만 서빙한다
            if "/" in name or name.startswith(".") or os.path.splitext(name)[1] not in CONTENT_TYPES:
                return self._json(404, {"error": "not found"})
            try:
                with open(os.path.join(STATIC_DIR, name), "rb") as f:
                    data = f.read()
            except OSError:
                return self._json(404, {"error": "not found"})
            self.send_response(200)
            self.send_header("Content-Type", CONTENT_TYPES[os.path.splitext(name)[1]])
            self.send_header("Content-Length", str(len(data)))
            self.send_header("Cache-Control", "no-cache")
            self.end_headers()
            self.wfile.write(data)


    if __name__ == "__main__":
        print("Pixel CV Quest listening on :%d (storage=%s)" % (PORT, "redis" if REDIS_HOST else "memory"), flush=True)
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
---
# 게임 화면 HTML/JS와 전시물 문서 (자동 생성: build_configmap.py)
apiVersion: v1
kind: ConfigMap
metadata:
  name: pixel-cv-static
  labels:
    app: pixel-cv
    app.kubernetes.io/part-of: pixel-cv
data:
  index.html: |
    <!doctype html>
    <html lang="ko">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>소미의 CV 밸리</title>
    <meta name="description" content="마을을 걸어 다니며 집 안의 포스터와 게시판으로 옥소미의 이력을 탐험하는 픽셀 RPG">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
    <style>
      :root {
        --wood: #8a5a36; --wood-dark: #5b3a22; --wood-light: #b98352; --paper: #fbf1dc; --paper-dark: #efdcb8;
        --ink: #4a2e1c; --muted: #8b6a50; --pink: #f08cb0; --pink-dark: #d8668f; --pink-light: #ffd3e3;
        --gold: #ffcf4a; --green: #5aa845; --bg: #2a1d27;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); }
      body { min-height: 100vh; display: flex; justify-content: center; padding: 12px 16px 20px; color: var(--ink);
        font-family: "Galmuri11", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
      .wrap { width: 100%; max-width: 1100px; }
      .stage { position: relative; border: 6px solid var(--wood-dark); border-radius: 10px; overflow: hidden; background: #000;
        box-shadow: 0 0 0 3px var(--wood-light) inset, 0 10px 0 rgba(0,0,0,.35); }
      canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; touch-action: none; cursor: pointer; }

      /* 우드 패널 공통 */
      .panel { background: var(--paper); border: 4px solid var(--wood-dark); border-radius: 6px;
        box-shadow: 0 0 0 3px var(--wood-light) inset, 0 0 0 2px var(--wood-dark), 0 4px 0 2px rgba(0,0,0,.35); }
      button { font: inherit; cursor: pointer; color: var(--ink); background: var(--paper); border: 3px solid var(--wood-dark);
        border-radius: 5px; padding: 6px 12px; font-size: 14px; box-shadow: inset 0 -3px 0 var(--paper-dark); }
      button:hover:not(:disabled) { background: #fff7e8; }
      button:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      button.pink { background: var(--pink); color: #fff; box-shadow: inset 0 -3px 0 var(--pink-dark); text-shadow: 1px 1px 0 var(--pink-dark); }
      button.pink:hover:not(:disabled) { background: #f6a1c0; }

      /* HUD */
      .hud { position: absolute; top: 6px; right: 8px; display: flex; flex-direction: row; align-items: center; gap: 6px; pointer-events: none; }
      .hud .box { pointer-events: auto; padding: 6px 12px; font-size: clamp(11px, 1.5vw, 15px); display: flex; gap: 12px; align-items: center; }
      .hud .place { font-weight: 700; color: var(--pink-dark); }
      .hud .gold { color: #b07800; font-weight: 700; }
      .hud .btns { display: flex; gap: 6px; pointer-events: auto; }
      .hud .btns button { padding: 4px 9px; font-size: 13px; }
      .hidden { display: none !important; }
      @media (max-width: 600px) {
        .hud { position: static; flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 6px; background: var(--wood-dark); }
        .hud .box { font-size: 11px; gap: 8px; padding: 4px 8px; }
        .dialog .who { width: 30%; }
        .dialog .next { right: calc(30% + 10px); }
      }

      .prompt { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 5px 12px; font-size: clamp(11px, 1.5vw, 14px);
        pointer-events: none; opacity: 0; transition: opacity .15s; white-space: nowrap; }
      .prompt.show { opacity: 1; }
      .toast { position: absolute; left: 50%; top: 14%; transform: translate(-50%, 0); padding: 7px 16px; font-size: clamp(13px, 1.8vw, 17px);
        color: #b07800; pointer-events: none; opacity: 0; transition: opacity .2s, transform .2s; white-space: nowrap; }
      .toast.show { opacity: 1; transform: translate(-50%, -8px); }

      /* 대화창 (초상화 포함) */
      .dialog { position: absolute; left: 2%; right: 2%; bottom: 3%; display: none; cursor: pointer; min-height: 30%; padding: 0; }
      .dialog.show { display: flex; }
      .dialog .text { flex: 1; padding: 14px 18px; font-size: clamp(13px, 2vw, 19px); line-height: 1.7; white-space: pre-line; }
      .dialog .who { width: 24%; max-width: 170px; border-left: 4px solid var(--wood-dark); display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 6px; padding: 10px; background: var(--paper-dark); }
      .dialog .who canvas { width: 70%; max-width: 96px; image-rendering: pixelated; background: #f9e7c4; border: 3px solid var(--wood); border-radius: 4px; cursor: inherit; }
      .dialog .who .name { font-size: clamp(11px, 1.6vw, 15px); font-weight: 700; background: var(--paper); border: 2px solid var(--wood); border-radius: 4px; padding: 2px 8px; white-space: nowrap; }
      .dialog .next { position: absolute; right: calc(24% + 14px); bottom: 8px; color: var(--pink-dark); animation: bob .7s steps(2) infinite; }
      @media (min-width: 720px) { .dialog .next { right: calc(min(24%, 170px) + 14px); } }
      @keyframes bob { 50% { transform: translateY(3px); } }

      /* 타이틀 */
      .title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2%; text-align: center; }
      .logo { font-family: "Galmuri14", "Galmuri11", sans-serif; font-size: clamp(30px, 7.5vw, 86px); line-height: 1.05; color: #fff;
        text-shadow: 0 4px 0 var(--pink-dark), 4px 0 0 var(--wood-dark), -4px 0 0 var(--wood-dark), 0 -4px 0 var(--wood-dark), 0 8px 0 var(--wood-dark),
          4px 4px 0 var(--wood-dark), -4px 4px 0 var(--wood-dark), 4px 8px 0 var(--wood-dark), -4px 8px 0 var(--wood-dark);
        animation: float 2.4s ease-in-out infinite; }
      .logo .pink { color: var(--pink-light); }
      .logo small { display: block; font-family: "Galmuri11", sans-serif; font-size: 32%; letter-spacing: 3px; margin-top: 10px; color: var(--gold);
        text-shadow: 2px 2px 0 var(--wood-dark), -2px 2px 0 var(--wood-dark), 2px -2px 0 var(--wood-dark), -2px -2px 0 var(--wood-dark); }
      @keyframes float { 50% { transform: translateY(-6px); } }
      .title .menu { display: flex; gap: 12px; margin-top: 3%; flex-wrap: wrap; justify-content: center; }
      .title .menu button { font-size: clamp(13px, 2vw, 20px); padding: 9px 20px; }
      .title .press { color: #fff; font-size: clamp(11px, 1.6vw, 15px); text-shadow: 2px 2px 0 var(--wood-dark); animation: blink 1.2s steps(2) infinite; }
      @keyframes blink { 50% { opacity: .2; } }

      /* 모바일 조작 */
      .controls { display: none; justify-content: space-between; align-items: center; margin-top: 12px; user-select: none; touch-action: none; }
      .pad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
      .pad button, .abtn { font-size: 20px; padding: 0; touch-action: none; }
      .abtn { width: 78px; height: 78px; border-radius: 50%; }
      @media (pointer: coarse) { .controls { display: flex; } }
      .hint { color: #e9cfe0; font-size: 12px; margin-top: 10px; text-align: center; line-height: 1.6; }

      /* 문서 / 모달 */
      .modal { position: fixed; inset: 0; background: rgba(30,16,24,.65); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
      .modal.show { display: flex; }
      .card { width: 100%; max-width: 720px; max-height: 90vh; display: flex; flex-direction: column; }
      .card .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: var(--wood);
        color: #fff; font-size: 16px; text-shadow: 2px 2px 0 var(--wood-dark); border-bottom: 4px solid var(--wood-dark); }
      .card .head button { padding: 2px 10px; }
      .card .body { overflow-y: auto; overflow-x: hidden; padding: 18px 22px 22px; }
      .doc { font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; font-size: 15px; line-height: 1.75; color: #3d2a1e; }
      .doc h1, .doc h2, .doc h3 { font-family: "Galmuri11", sans-serif; color: var(--ink); line-height: 1.4; }
      .doc h1 { font-size: 22px; margin: 4px 0 12px; color: var(--pink-dark); }
      .doc h2 { font-size: 17px; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 2px dashed var(--paper-dark); }
      .doc h3 { font-size: 15px; margin: 16px 0 6px; }
      .doc p { margin: 8px 0; }
      .doc ul, .doc ol { margin: 6px 0; padding-left: 22px; }
      .doc li { margin: 3px 0; }
      .doc strong { color: #8a3d5c; }
      .doc a { color: #c2185b; text-underline-offset: 3px; }
      .doc code { background: #f3e2c2; border-radius: 4px; padding: 1px 6px; font-size: 13px; font-family: "GalmuriMono11", Consolas, monospace; }
      .doc pre { background: #3b2a22; color: #fbe9d0; padding: 12px 14px; border-radius: 6px; overflow-x: auto; font-size: 12px; line-height: 1.5; }
      .doc pre code { background: none; padding: 0; color: inherit; }
      .doc blockquote { margin: 12px 0; padding: 8px 14px; background: #fde7ef; border-left: 5px solid var(--pink); border-radius: 0 6px 6px 0; }
      .doc hr { border: none; border-top: 2px dashed var(--paper-dark); margin: 18px 0; }
      .doc table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; display: block; overflow-x: auto; }
      .doc th, .doc td { border: 2px solid var(--paper-dark); padding: 6px 10px; text-align: left; vertical-align: top; }
      .doc th { background: #f6e3c3; font-weight: 700; white-space: nowrap; }
      .doc img { max-width: 100%; border-radius: 6px; border: 3px solid var(--paper-dark); display: block; margin: 8px auto; }
      .doc video, .doc iframe { width: 100%; aspect-ratio: 16/9; border: 3px solid var(--wood-dark); border-radius: 6px; background: #000; }
      .doc .part { margin-top: 26px; padding-top: 8px; border-top: 4px double var(--paper-dark); }

      input, textarea { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: #fffaf0; border: 3px solid var(--wood-light);
        border-radius: 5px; padding: 8px; margin-top: 8px; }
      textarea { resize: vertical; min-height: 72px; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
      .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
      .sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
      .msg { font-size: 13px; margin-top: 8px; min-height: 18px; }
      .msg.err { color: #c62828; } .msg.ok { color: #2e7d32; }
      .entries { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
      .entries li { background: #fffaf0; border: 2px solid var(--paper-dark); border-radius: 6px; padding: 8px 12px; font-size: 14px;
        overflow-wrap: anywhere; font-family: "Pretendard", "Malgun Gothic", sans-serif; }
      .entries .who { color: var(--pink-dark); font-weight: 700; margin-right: 6px; font-family: "Galmuri11", sans-serif; }
      .entries .when { color: var(--muted); font-size: 11px; float: right; }
      .stars { display: flex; gap: 6px; justify-content: center; margin: 16px 0 6px; }
      .stars button { font-size: 34px; background: none; border: none; box-shadow: none; color: #d9c7a6; padding: 2px; }
      .stars button.on { color: #ffb300; text-shadow: 2px 2px 0 var(--wood-dark); }
      .big { text-align: center; font-size: 15px; }
      .bigmap { width: 100%; height: auto; image-rendering: pixelated; border: 4px solid var(--wood-dark); border-radius: 6px; cursor: pointer; display: block; }
      .places { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
      .places button { font-size: 13px; padding: 5px 10px; }
    </style>
    </head>
    <body>
    <div class="wrap">
      <div class="stage" id="stage">
        <canvas id="game" aria-label="소미의 CV 밸리 게임 화면"></canvas>

        <div class="title" id="title">
          <div class="logo"><span class="pink">소미의</span> CV 밸리<small>~ SOMI'S CV VALLEY ~</small></div>
          <div class="menu">
            <button class="pink" id="btnStart">▶ 마을로 들어가기</button>
            <button id="btnQuickCv">📜 CV 바로 보기</button>
          </div>
          <div class="press">Enter / Space 를 눌러 시작</div>
        </div>

        <div class="hud hidden" id="hud">
          <div class="panel box">
            <span class="place" id="hudPlace">광장</span>
            <span class="gold">💰 <span id="hudPoints">0</span>G</span>
            <span>📜 <span id="hudFound">0</span>/<span id="hudTotal">0</span></span>
            <span>⭐ <span id="hudRating">-</span></span>
          </div>
          <div class="btns">
            <button id="btnMap">🗺️ 지도</button>
            <button id="btnCv">📜 CV 전체</button>
            <button id="btnHelp">❓</button>
          </div>
          <div class="panel box hidden" id="hudOffline" style="color:#c62828">서버 연결 끊김</div>
        </div>

        <div class="panel prompt" id="prompt"></div>
        <div class="panel toast" id="toast"></div>
        <div class="panel dialog" id="dialog" role="dialog" aria-live="polite">
          <div class="text" id="dlgText"></div>
          <div class="next">▼</div>
          <div class="who"><canvas id="portrait" width="16" height="24"></canvas><div class="name" id="dlgName"></div></div>
        </div>
      </div>

      <div class="controls" id="controls">
        <div class="pad">
          <span></span><button data-dir="up" aria-label="위">▲</button><span></span>
          <button data-dir="left" aria-label="왼쪽">◀</button><span></span><button data-dir="right" aria-label="오른쪽">▶</button>
          <span></span><button data-dir="down" aria-label="아래">▼</button><span></span>
        </div>
        <button class="abtn pink" id="btnA" aria-label="확인">A</button>
      </div>

      <p class="hint">← ↑ → ↓ / WASD 이동 · Space / Enter 대화·조사 · M 지도 · 마우스로 클릭하면 그곳까지 걸어가요<br>
        집에 들어가 포스터와 게시판을 읽으면 💰G를 받아요. G로 광장에서 📮방명록과 ⭐별점을 남겨 주세요!</p>
    </div>

    <div class="modal" id="modal"><div class="panel card"><div class="head"><span id="cardTitle"></span><button id="cardClose">✕</button></div><div class="body" id="cardBody"></div></div></div>

    <script src="content.js"></script>
    <script src="game.js"></script>
    </body>
    </html>
  game.js: |
    /* 소미의 CV 밸리 — 걸어 다니며 읽는 픽셀 이력서
     * 외부 라이브러리 없이 Canvas로 그린다. 모든 그래픽은 이 파일 안의 코드/문자열 픽셀 맵으로 생성한다.
     */
    (() => {
      'use strict';

      const T = 16, VW = 320, VH = 180, S = 4;   // 타일 크기, 화면(논리 픽셀), 확대 배율
      const canvas = document.getElementById('game');
      canvas.width = VW * S;
      canvas.height = VH * S;
      const ctx = canvas.getContext('2d');
      const $ = (id) => document.getElementById(id);
      const FONT = '"Galmuri11", "Malgun Gothic", sans-serif';

      // ================================================================ 공통 유틸
      function hash(x, y) {
        let h = (x * 374761393 + y * 668265263) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
      }
      const px = (g, c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
      function blob(g, cx, cy, r, c) {
        g.fillStyle = c;
        for (let dy = -r; dy <= r; dy++) {
          const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.6));
          g.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
        }
      }
      function makeCanvas(w, h, draw) {
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d');
        g.imageSmoothingEnabled = false;
        draw(g);
        return c;
      }
      function sprite(rows, pal, flip = false) {
        const w = rows[0].length;
        return makeCanvas(w, rows.length, (g) => rows.forEach((row, y) => {
          if (row.length !== w) console.warn('sprite row length', row);
          for (let x = 0; x < w; x++) {
            const ch = row[flip ? w - 1 - x : x];
            if (pal[ch]) px(g, pal[ch], x, y);
          }
        }));
      }
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      // ================================================================ 캐릭터 스프라이트 (16×24)
      // 주인공: 검은 긴 레이어드 머리 + 시스루 앞머리, 회색 니트 카라 가디건, 핑크 스커트
      const PAL_ME = {
        k: '#1d1b26', K: '#45425a', s: '#f9dccb', e: '#2a1c1c', w: '#ffffff', c: '#f5a3b5', m: '#e07a8c',
        l: '#b4aebb', g: '#8f8996', G: '#6c6674', b: '#2c2a31', r: '#f08cb0', R: '#d8668f', o: '#fff7f2', f: '#6b3f45',
      };
      const HEAD = [
        '......kkkk......',
        '....kkkkkkkk....',
        '...kkkkkkkKkk...',
        '..kkkkkkkkkKkk..',
        '..kkkkkkkkkkkk..',
      ];
      const ME_DOWN = HEAD.concat([
        '..kk' + 'kkkskkkk' + 'kk..',
        '..kk' + 'kskkskks' + 'kk..',
        '..kk' + 'seessees' + 'kk..',
        '..kk' + 'cewssewc' + 'kk..',
        '..kk' + 'sssmmsss' + 'kk..',
        '..kkk' + 'ssssss' + 'kkk..',
        '.kkkkk' + 'ssss' + 'kkkkk.',
        '.kkk' + 'llgssgll' + 'kkk.',
        '.kkG' + 'gggbgggg' + 'Gkk.',
        '.kkG' + 'gggggggg' + 'Gkk.',
        '.kkG' + 'gggbgggg' + 'Gkk.',
        '..sG' + 'gggggggg' + 'Gs..',
        '...G' + 'gggggggg' + 'G...',
        '...r' + 'rrRrrRrr' + 'r...',
        '..rr' + 'rRrrrrRr' + 'rr..',
      ]);
      const ME_UP = HEAD.concat([
        '..kkkkkkkkkkkk..',
        '..kkkkkkkkkkkk..',
        '..kkkkkkKkkkkk..',
        '..kkkkkkkkkkkk..',
        '..kkkkkkkkkkkk..',
        '..kkkkkkkkkkkk..',
        '.kkkkkkkkkkkkkk.',
        '.kkkkkkkkkkkkkk.',
        '.kGkkkkkkkkkkGk.',
        '.kGgkkkkkkkkgGk.',
        '.kGggkkkkkkggGk.',
        '..sGggkkkkggGs..',
        '...GgggkkgggG...',
        '...r' + 'rrRrrRrr' + 'r...',
        '..rr' + 'rRrrrrRr' + 'rr..',
      ]);
      const ME_LEFT = HEAD.concat([
        '..kskkkkkkkkkk..',
        '..' + 'sskkkkkkkkkkk' + '.',
        '..' + 'sewskkkkkkkkk' + '.',
        '..' + 'cssskkkkkkkkk' + '.',
        '..' + 'smsskkkkkkkkk' + '.',
        '...' + 'ssssskkkkkkk' + '.',
        '....' + 'ssskkkkkkkk' + '.',
        '....' + 'lggkkkkkkkk' + '.',
        '...' + 'gggggkkkkkkk' + '.',
        '...' + 'ggggggkkkkkk' + '.',
        '...' + 'sgggggGkkkkk' + '.',
        '....' + 'gggggGkkkk' + '..',
        '....' + 'GggggggG' + '....',
        '....' + 'rrRrrRrr' + '....',
        '...' + 'rrRrrrrRrr' + '...',
      ]);
      const LEGS_FRONT = [
        ['....ss....ss....', '....oo....oo....', '...ffff..ffff...', '................'],
        ['...ss......ss...', '...oo......oo...', '..ffff....ffff..', '................'],
        ['.....ss..ss.....', '.....oo..oo.....', '....ffffffff....', '................'],
      ];
      const LEGS_SIDE = [
        ['......ss........', '......oo........', '.....fff........', '................'],
        ['....ss...ss.....', '....oo...oo.....', '...fff...fff....', '................'],
        ['......ss........', '......oo........', '.....fff........', '................'],
      ];
      const ME = {
        down: LEGS_FRONT.map((l) => sprite(ME_DOWN.concat(l), PAL_ME)),
        up: LEGS_FRONT.map((l) => sprite(ME_UP.concat(l), PAL_ME)),
        left: LEGS_SIDE.map((l) => sprite(ME_LEFT.concat(l), PAL_ME)),
        right: LEGS_SIDE.map((l) => sprite(ME_LEFT.concat(l), PAL_ME, true)),
      };

      const PERSON = [
        '................',
        '................',
        '.....HHHHHH.....',
        '....HHHHHHHH....',
        '...HHHHHHHHHH...',
        '...HHHHHhHHHH...',
        '...HHsHHHHsHH...',
        '...H' + 'ssssssss' + 'H...',
        '....' + 'seessees' + '....',
        '....' + 'csssssc' + 's....',
        '....' + 'sssmmsss' + '....',
        '.....ssssss.....',
        '......ssss......',
        '....TTTssTTT....',
        '...TTTTTTTTTT...',
        '...TTTTTTTTTT...',
        '...sTTTTTTTTs...',
        '...sTTTTTTTTs...',
        '....tttttttt....',
        '....PPPPPPPP....',
        '....PPP..PPP....',
        '....PPP..PPP....',
        '....fff..fff....',
        '................',
      ];
      const BOT = [
        '................',
        '.......rr.......',
        '.......LL.......',
        '....LLLLLLLL....',
        '...LMMMMMMMML...',
        '...LMcMMMMcML...',
        '...LMcMMMMcML...',
        '...LMMMMMMMML...',
        '...LMMMppMMML...',
        '....LLLLLLLL....',
        '......LLLL......',
        '....DDDDDDDD....',
        '...LDDDDDDDDL...',
        '..LLDDYYYYDDLL..',
        '..L.DDYYYYDD.L..',
        '..L.DDDDDDDD.L..',
        '..H.DDDDDDDD.H..',
        '....DDDDDDDD....',
        '.....DD..DD.....',
        '.....LL..LL.....',
        '.....LL..LL.....',
        '....MMM..MMM....',
        '................',
        '................',
      ];
      const CAT = [
        '................', '................', '................', '................',
        '................', '................', '................', '................',
        '................', '................', '................', '................',
        '..o.....o.......',
        '..oo...oo.......',
        '..ooooooo.......',
        '..oeoooeo.......',
        '..ooopooo...t...',
        '..ooooooo...t...',
        '...ooooooo.t....',
        '..ooooooooot....',
        '..ooooooooo.....',
        '..ww..ww........',
        '................',
        '................',
      ];
      const BASE_NPC = { s: '#f6d5c0', e: '#2b1d18', c: '#f3b2b2', m: '#c96b6b', f: '#3b2a26', a: '#2a2430' };
      const withGlasses = (rows) => rows.map((r, i) => (i === 8 ? '....' + 'aeassaea' + '....' : r));
      const NPC_SPRITES = {
        bot: sprite(BOT, { r: '#ff6b8f', L: '#e4e8f2', M: '#2c3150', c: '#7ef3ff', p: '#ff9ec0', D: '#2f6fd0', Y: '#ffd23f', H: '#9aa3b5' }),
        senior: sprite(withGlasses(PERSON), { ...BASE_NPC, H: '#5a3b2a', h: '#7a5640', T: '#f7f7f7', t: '#c9ccd6', P: '#3b4a6b' }),
        teammate: sprite(PERSON, { ...BASE_NPC, H: '#2b2b35', h: '#45455a', T: '#f08cb0', t: '#d8668f', P: '#3a3f5c' }),
        mc: sprite(PERSON, { ...BASE_NPC, H: '#e8b84a', h: '#ffd77a', T: '#7b5cd6', t: '#5b40ad', P: '#262633' }),
        scientist: sprite(withGlasses(PERSON), { ...BASE_NPC, H: '#6b4a8c', h: '#8e6bb0', T: '#ffffff', t: '#d4dbe6', P: '#42506b' }),
        cat: sprite(CAT, { o: '#f6e3c6', e: '#3a2a2a', p: '#f08cb0', t: '#e2c7a2', w: '#ffffff' }),
      };

      // ================================================================ 마을 소품 그리기
      const TREE = {
        oak: makeCanvas(32, 42, (g) => {
          px(g, '#6b4430', 13, 26, 6, 15); px(g, '#563424', 13, 26, 2, 15); px(g, '#4a2c1e', 11, 40, 10, 2);
          blob(g, 16, 16, 13, '#3c7d32'); blob(g, 10, 20, 8, '#3c7d32'); blob(g, 22, 20, 8, '#3c7d32');
          blob(g, 15, 13, 10, '#4f9a3c'); blob(g, 11, 18, 6, '#4f9a3c'); blob(g, 21, 17, 6, '#4f9a3c');
          blob(g, 12, 9, 5, '#6cb84a'); blob(g, 19, 12, 3, '#6cb84a');
          [[8, 22], [20, 24], [24, 15], [6, 14]].forEach(([x, y]) => px(g, '#2f6427', x, y, 2, 2));
        }),
        cherry: makeCanvas(32, 42, (g) => {
          px(g, '#7a4a35', 13, 26, 6, 15); px(g, '#5e3626', 13, 26, 2, 15); px(g, '#4a2c1e', 11, 40, 10, 2);
          px(g, '#7a4a35', 9, 22, 5, 2); px(g, '#7a4a35', 18, 21, 6, 2);
          blob(g, 16, 16, 13, '#e682a8'); blob(g, 9, 20, 8, '#e682a8'); blob(g, 23, 20, 8, '#e682a8');
          blob(g, 15, 13, 10, '#f5a9c6'); blob(g, 10, 18, 6, '#f5a9c6'); blob(g, 22, 17, 6, '#f5a9c6');
          blob(g, 12, 9, 5, '#ffd3e3'); blob(g, 20, 12, 3, '#ffd3e3');
          for (let i = 0; i < 14; i++) px(g, '#ffffff', 4 + Math.floor(hash(i, 3) * 24), 4 + Math.floor(hash(3, i) * 22), 1, 1);
        }),
        bush: makeCanvas(16, 16, (g) => {
          blob(g, 8, 9, 6, '#3c7d32'); blob(g, 7, 8, 5, '#5aa845'); blob(g, 6, 6, 2, '#7cc45a');
          [[4, 9], [10, 7], [9, 11]].forEach(([x, y]) => px(g, '#ff8fb8', x, y, 2, 2));
        }),
      };

      function drawHouseCanvas(h) {
        const W = h.w * T + 8, H = h.h * T + 24;
        return makeCanvas(W, H, (g) => {
          const top = 24, wallY = top + Math.floor(h.h * T * 0.42), bottom = top + h.h * T;
          const L = 4, R = 4 + h.w * T;
          // 벽
          px(g, h.wall, L, wallY, h.w * T, bottom - wallY);
          for (let y = wallY + 3; y < bottom - 4; y += 4) px(g, h.wallLine, L, y, h.w * T, 1);
          px(g, h.wallLine, L, wallY, 3, bottom - wallY); px(g, h.wallLine, R - 3, wallY, 3, bottom - wallY);
          px(g, '#8d857c', L - 1, bottom - 5, h.w * T + 2, 5);
