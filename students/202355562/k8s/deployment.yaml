# 1) 웹 + API 서버: UBI Python 이미지에 ConfigMap으로 코드와 정적 파일을 주입해서 실행
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixel-cv-web
  labels:
    app: pixel-cv
    component: web
    app.kubernetes.io/part-of: pixel-cv
    app.openshift.io/runtime: python
  annotations:
    # 웹 콘솔 Topology 화면에 web → redis 연결 화살표를 표시
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"pixel-cv-redis"}]'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pixel-cv
      component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pixel-cv
        component: web
    spec:
      containers:
        - name: web
          image: registry.access.redhat.com/ubi9/python-311:9.8
          command: ["python3", "/opt/app-root/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pixel-cv-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pixel-cv-redis
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: code
              mountPath: /opt/app-root/app
              readOnly: true
            - name: static
              mountPath: /opt/app-root/static
              readOnly: true
          readinessProbe:          # Redis까지 연결돼야 트래픽을 받는다
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:           # 서버 프로세스가 멈추면 재시작
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
      volumes:
        - name: code
          configMap:
            name: pixel-cv-code
        - name: static
          configMap:
            name: pixel-cv-static
---
# 2) DB: Redis 7 (비루트 실행을 지원하는 Red Hat SCL 이미지) + PVC로 데이터 유지
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixel-cv-redis
  labels:
    app: pixel-cv
    component: redis
    app.kubernetes.io/part-of: pixel-cv
    app.openshift.io/runtime: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pixel-cv
      component: redis
  strategy:
    type: Recreate               # RWO 볼륨은 Pod 하나만 붙을 수 있으므로 교체 시 먼저 내리고 올린다
  template:
    metadata:
      labels:
        app: pixel-cv
        component: redis
    spec:
      containers:
        - name: redis
          image: quay.io/sclorg/redis-7-c9s:20250108
          args: ["run-redis", "--appendonly", "yes"]   # AOF로 매 쓰기를 디스크에 기록
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pixel-cv-redis
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/redis/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pixel-cv-redis-data
