# 웹 서버용 Service: Route가 이 Service로 트래픽을 보낸다
apiVersion: v1
kind: Service
metadata:
  name: pixel-cv-web
  labels:
    app: pixel-cv
    component: web
    app.kubernetes.io/part-of: pixel-cv
spec:
  selector:
    app: pixel-cv
    component: web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Redis용 Service: 클러스터 내부 전용 (웹 서버가 pixel-cv-redis:6379 로 접속)
apiVersion: v1
kind: Service
metadata:
  name: pixel-cv-redis
  labels:
    app: pixel-cv
    component: redis
    app.kubernetes.io/part-of: pixel-cv
spec:
  selector:
    app: pixel-cv
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
